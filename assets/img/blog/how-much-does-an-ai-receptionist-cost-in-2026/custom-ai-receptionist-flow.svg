<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Poppins, 'Liberation Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A9BB4"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E5604D"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14213D" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="#F4F7FB"/>

  <!-- Title -->
  <text x="80" y="92" font-size="40" font-weight="600" fill="#14213D">How a custom AI receptionist handles a call</text>
  <text x="80" y="134" font-size="22" fill="#5B6B82">One call in, the right action out, with everything saved for your team</text>

  <!-- Incoming call -->
  <g filter="url(#sh)">
    <rect x="80" y="385" width="330" height="140" rx="20" fill="#FFFFFF"/>
  </g>
  <circle cx="140" cy="455" r="32" fill="#E3F4F4"/>
  <path d="M128,440 c3,-3 7,-3 9,0 l5,7 c2,3 1,6 -1,8 l-3,3 c3,6 8,11 14,14 l3,-3 c2,-2 5,-3 8,-1 l7,5 c3,2 3,6 0,9 l-4,4 c-4,4 -11,4 -17,1 c-12,-6 -22,-16 -28,-28 c-3,-6 -3,-13 1,-17 z" fill="#0F9B9B"/>
  <text x="190" y="448" font-size="26" font-weight="600" fill="#14213D">Incoming call</text>
  <text x="190" y="480" font-size="19" fill="#5B6B82">Day, night or weekend</text>

  <!-- Arrow to AI -->
  <line x1="412" y1="455" x2="506" y2="455" stroke="#8A9BB4" stroke-width="3" marker-end="url(#ah)"/>

  <!-- AI receptionist (hero node) -->
  <g filter="url(#sh)">
    <rect x="510" y="355" width="400" height="200" rx="28" fill="#14213D"/>
  </g>
  <!-- sound wave -->
  <g fill="#3FD0C9">
    <rect x="550" y="440" width="8" height="30" rx="4"/>
    <rect x="566" y="425" width="8" height="60" rx="4"/>
    <rect x="582" y="410" width="8" height="90" rx="4"/>
    <rect x="598" y="430" width="8" height="50" rx="4"/>
    <rect x="614" y="445" width="8" height="20" rx="4"/>
  </g>
  <text x="650" y="440" font-size="32" font-weight="600" fill="#FFFFFF">AI receptionist</text>
  <text x="650" y="476" font-size="19" fill="#B9C6DA">Understands the caller</text>
  <text x="650" y="504" font-size="19" fill="#B9C6DA">and picks the next step</text>

  <!-- Branch connectors -->
  <path d="M912,455 C985,455 975,245 1036,245" fill="none" stroke="#8A9BB4" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M912,455 C985,455 975,385 1036,385" fill="none" stroke="#8A9BB4" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M912,455 C985,455 975,525 1036,525" fill="none" stroke="#8A9BB4" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M912,455 C985,455 975,665 1036,665" fill="none" stroke="#E5604D" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ahr)"/>

  <!-- Card 1: Calendar booking -->
  <g filter="url(#sh)"><rect x="1040" y="190" width="480" height="110" rx="18" fill="#FFFFFF"/></g>
  <rect x="1040" y="190" width="8" height="110" rx="4" fill="#0F9B9B"/>
  <circle cx="1105" cy="245" r="30" fill="#E3F4F4"/>
  <rect x="1090" y="232" width="30" height="28" rx="4" fill="none" stroke="#0F9B9B" stroke-width="3"/>
  <line x1="1090" y1="241" x2="1120" y2="241" stroke="#0F9B9B" stroke-width="3"/>
  <line x1="1098" y1="227" x2="1098" y2="235" stroke="#0F9B9B" stroke-width="3" stroke-linecap="round"/>
  <line x1="1112" y1="227" x2="1112" y2="235" stroke="#0F9B9B" stroke-width="3" stroke-linecap="round"/>
  <text x="1155" y="238" font-size="25" font-weight="600" fill="#14213D">Calendar booking</text>
  <text x="1155" y="268" font-size="18" fill="#5B6B82">Checks live slots and books them</text>

  <!-- Card 2: CRM update -->
  <g filter="url(#sh)"><rect x="1040" y="330" width="480" height="110" rx="18" fill="#FFFFFF"/></g>
  <rect x="1040" y="330" width="8" height="110" rx="4" fill="#2F5BEA"/>
  <circle cx="1105" cy="385" r="30" fill="#E6ECFD"/>
  <ellipse cx="1105" cy="372" rx="14" ry="5" fill="none" stroke="#2F5BEA" stroke-width="3"/>
  <path d="M1091,372 v24 c0,3 6,5 14,5 s14,-2 14,-5 v-24" fill="none" stroke="#2F5BEA" stroke-width="3"/>
  <path d="M1091,384 c0,3 6,5 14,5 s14,-2 14,-5" fill="none" stroke="#2F5BEA" stroke-width="3"/>
  <text x="1155" y="378" font-size="25" font-weight="600" fill="#14213D">CRM update</text>
  <text x="1155" y="408" font-size="18" fill="#5B6B82">Saves details, summary and next step</text>

  <!-- Card 3: SMS follow-up -->
  <g filter="url(#sh)"><rect x="1040" y="470" width="480" height="110" rx="18" fill="#FFFFFF"/></g>
  <rect x="1040" y="470" width="8" height="110" rx="4" fill="#E39B2B"/>
  <circle cx="1105" cy="525" r="30" fill="#FCF0DC"/>
  <path d="M1090,512 h30 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-18 l-8,7 v-7 h-4 a4,4 0 0 1 -4,-4 v-16 a4,4 0 0 1 4,-4 z" fill="none" stroke="#E39B2B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="1098" cy="524" r="2.5" fill="#E39B2B"/><circle cx="1105" cy="524" r="2.5" fill="#E39B2B"/><circle cx="1112" cy="524" r="2.5" fill="#E39B2B"/>
  <text x="1155" y="518" font-size="25" font-weight="600" fill="#14213D">SMS follow-up</text>
  <text x="1155" y="548" font-size="18" fill="#5B6B82">Sends a confirmation or intake link</text>

  <!-- Card 4: Human handoff -->
  <g filter="url(#sh)"><rect x="1040" y="610" width="480" height="110" rx="18" fill="#FFFFFF"/></g>
  <rect x="1040" y="610" width="8" height="110" rx="4" fill="#E5604D"/>
  <circle cx="1105" cy="665" r="30" fill="#FCE5E1"/>
  <circle cx="1105" cy="656" r="8" fill="none" stroke="#E5604D" stroke-width="3"/>
  <path d="M1090,682 c0,-9 7,-15 15,-15 s15,6 15,15" fill="none" stroke="#E5604D" stroke-width="3" stroke-linecap="round"/>
  <text x="1155" y="658" font-size="25" font-weight="600" fill="#14213D">Human handoff</text>
  <text x="1155" y="688" font-size="18" fill="#5B6B82">Passes urgent calls on, with context</text>

  <!-- Legend / footer -->
  <line x1="80" y1="690" x2="130" y2="690" stroke="#E5604D" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="145" y="697" font-size="18" fill="#5B6B82">Only when a person is needed</text>
  <text x="80" y="745" font-size="18" font-weight="500" fill="#8A9BB4">softdev.me</text>
</svg>
